[package]
name = "corridor-escrow"
version = "0.1.0"
edition = "2021"
description = "Soroban escrow contract for the Africa ↔ Latin America P2P agent corridor"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
