name: Web CI

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
        working-directory: web
      - name: ESLint
        run: pnpm exec eslint .
        working-directory: web

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Run tests
        run: pnpm exec jest --passWithNoTests --coverage
        working-directory: web
      - name: Check test count
        run: |
          OUTPUT=$(pnpm exec jest --passWithNoTests 2>&1)
          PASSED=$(echo "$OUTPUT" | grep "Tests:" | grep -oP '\d+ passed' | grep -oP '\d+')
          echo "Tests passed: $PASSED"
          if [ "$PASSED" -lt 20 ]; then
            echo "ERROR: Expected at least 20 tests, got $PASSED"
            exit 1
          fi
        working-directory: web

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build
        run: pnpm run build
        working-directory: web
        env:
          NEXT_PUBLIC_POLLAR_API_KEY: ${{ secrets.POLLAR_API_KEY }}
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
