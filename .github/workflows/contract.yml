name: Contract CI

on:
  push:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contract.yml']
  pull_request:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contract.yml']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/corridor_escrow/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/corridor_escrow/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Cargo fmt check
        run: cargo fmt --check
        working-directory: contracts/corridor_escrow
      - name: Cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: contracts/corridor_escrow

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/corridor_escrow/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('contracts/corridor_escrow/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Run tests
        run: cargo test -- --nocapture
        working-directory: contracts/corridor_escrow
      - name: Test count check
        run: |
          OUTPUT=$(cargo test 2>&1)
          PASSED=$(echo "$OUTPUT" | grep "test result:" | grep -oP '\d+ passed' | grep -oP '\d+')
          echo "Tests passed: $PASSED"
          if [ "$PASSED" -lt 40 ]; then
            echo "ERROR: Expected at least 40 tests, got $PASSED"
            exit 1
          fi
        working-directory: contracts/corridor_escrow

  build:
    name: WASM Build
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/corridor_escrow/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('contracts/corridor_escrow/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: contracts/corridor_escrow
      - name: Check WASM size
        run: |
          SIZE=$(stat -c%s target/wasm32-unknown-unknown/release/corridor_escrow.wasm)
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt 100000 ]; then
            echo "ERROR: WASM too large ($SIZE bytes, max 100KB)"
            exit 1
          fi
        working-directory: contracts/corridor_escrow
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: corridor-escrow-wasm
          path: contracts/corridor_escrow/target/wasm32-unknown-unknown/release/corridor_escrow.wasm
